[package]
name = "dareskro-escrow"
version = "0.1.0"
edition = "2024"
description = "dareskro on NEAR: the escrow is a contract with no owner. Time-locked or condition-locked NEAR, released to the destination written at creation; nobody can redirect it."
license = "MIT OR Apache-2.0"
repository = "https://github.com/LeDenti/dareskro"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
