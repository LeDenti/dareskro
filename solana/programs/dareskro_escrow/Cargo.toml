[package]
name = "dareskro_escrow"
version = "0.1.0"
description = "dareskro on Solana: an escrow program with no owner. Time-locked or condition-locked SOL or SPL tokens, released to the destination written at creation; nobody can redirect it."
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "dareskro_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.2"
anchor-spl = "1.2.2"
solana-sha256-hasher = "3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
