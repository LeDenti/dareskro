[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
dareskro_escrow = "6NoVNiHvEsagkYYobHjrwQgkqL5xHp5zGStZK4YtdPSu"

[programs.devnet]
dareskro_escrow = "6NoVNiHvEsagkYYobHjrwQgkqL5xHp5zGStZK4YtdPSu"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

# the local validator loads the program as upgradeable, with the test wallet as its upgrade
# authority — the fee schedule can only be created by that authority (config_init)
[[test.genesis]]
address = "6NoVNiHvEsagkYYobHjrwQgkqL5xHp5zGStZK4YtdPSu"
program = "target/deploy/dareskro_escrow.so"
upgradeable = true
